name: Correctness tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run bench:check -- --output bench/results/ci.json
      - run: npm run bench:settling -- --samples 1 --warmup 0 --output bench/results/ci-settling.json
      - run: npm run bench:quality -- --samples 1 --warmup 0 --rounds 1 --output bench/results/ci-quality.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks-node-${{ matrix.node }}
          path: |
            bench/results/ci.json
            bench/results/ci.md
            bench/results/ci-settling.json
            bench/results/ci-settling.md
            bench/results/ci-quality.json
            bench/results/ci-quality.md
          if-no-files-found: ignore
